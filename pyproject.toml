[project]
name = "basin"
version = "0.3.0"
requires-python = ">=3.10"
description = "A deterministic sandbox for decentralized scheduling with delayed gossip"
dependencies = ["matplotlib>=3.7"]

[project.scripts]
basin = "basin.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
